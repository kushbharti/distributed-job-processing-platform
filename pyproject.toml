[project]
name = "distributed-job-platform"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "celery[redis]>=5.7.0",
    "fastapi>=0.163.1",
    "psycopg[binary]>=3.3.9",
    "pwdlib[argon2]>=0.4.2",
    "pydantic[email]>=2.14.3",
    "pyjwt>=2.15.1",
    "pymupdf>=2.1",
    "python-decouple>=3.8",
    "python-multipart>=0.0.34",
    "redis>=8.1.0",
    "reportlab>=5.1.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.coverage.run]
source = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Query()/Depends() defaults are intentional. B904: we raise HTTPException deliberately.
ignore = ["B008", "B904"]
